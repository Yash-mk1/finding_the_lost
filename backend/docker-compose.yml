services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ftl}
      POSTGRES_USER: ${POSTGRES_USER:-ftl}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ftl}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ftl} -d ${POSTGRES_DB:-ftl}"]
      interval: 5s
      retries: 10

  api:
    build: .
    env_file: .env
    environment:
      POSTGRES_HOST: db
    volumes:
      - media:/app/media
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  # Optional: a free HTTPS address for the API, so passwords and photos are
  # encrypted and phones can reach it from any network (not just your Wi-Fi).
  # Start with:  docker compose --profile tunnel up
  # Then find the https://....trycloudflare.com address in the "tunnel" logs
  # and enter it on the app's login screen. It changes every time you restart.
  tunnel:
    # If Docker can't find this version, change it to cloudflare/cloudflared:latest
    image: cloudflare/cloudflared:2026.10.3
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate --url http://api:8000
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
  media:
