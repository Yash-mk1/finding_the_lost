# Builds the Android APK on GitHub's servers, so no Android Studio or
# Android SDK is needed on your computer.
#
# Runs on every push that changes the app, or by hand from the Actions tab
# (where you can also bake in your server address).
#
# Where to get the APK afterwards:
#   - Releases (right side of the repo page): open it on your phone and
#     tap the .apk to install.
#   - Actions -> the run -> "Artifacts" at the bottom (downloads as a zip).

name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:
    inputs:
      api_base:
        description: "Server address baked into the app (leave empty to use the API_BASE repository variable)"
        required: false
        default: ""

permissions:
  contents: write # needed to publish the APK as a release

# If you push again while a build is running, the older build is cancelled.
concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21" # newer Android build tools need Java 21

      # Pinned on purpose. An unpinned "latest stable" changes under you and
      # can break a build that worked yesterday. To upgrade, change this number
      # (and check the Java version above still matches what Flutter needs).
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.50.0"
          cache: true

      - name: Flutter version
        run: flutter --version

      # The repo holds only the app code and AndroidManifest.xml; this adds the
      # standard Android project files around it without overwriting anything.
      - name: Generate Android project files
        run: flutter create --platforms=android --org com.findingthelost --project-name finding_the_lost .

      - name: Get packages
        run: flutter pub get

      # Problems are listed in the run's summary page so they are easy to
      # screenshot. This step never fails the build; the APK build below does
      # if the code doesn't compile.
      - name: Check code (flutter analyze)
        continue-on-error: true
        run: |
          set +e
          flutter analyze --no-fatal-infos --no-fatal-warnings > analyze.txt 2>&1
          status=$?
          {
            echo "## flutter analyze"
            echo '```'
            cat analyze.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cat analyze.txt
          exit $status

      - name: Run unit tests
        continue-on-error: true
        run: flutter test

      # Sign every build with the same test key (app/ci/debug.keystore), so a
      # new APK installs over the old one. Without this, each build gets a
      # random key and Android refuses the update with "App not installed".
      - name: Use the project's test signing key
        run: |
          for dir in "$HOME/.android" "${ANDROID_USER_HOME:-}" "${ANDROID_SDK_HOME:+$ANDROID_SDK_HOME/.android}"; do
            if [ -n "$dir" ]; then
              mkdir -p "$dir"
              cp ci/debug.keystore "$dir/debug.keystore"
            fi
          done

      - name: Build APK
        env:
          # A manual run's address wins; otherwise the repository variable
          # API_BASE; otherwise the address written in app/lib/session.dart.
          API_BASE: ${{ github.event.inputs.api_base || vars.API_BASE }}
        run: |
          args=(--release --build-number="$GITHUB_RUN_NUMBER")
          if [ -n "$API_BASE" ]; then
            args+=("--dart-define=API_BASE=$API_BASE")
          fi
          flutter build apk "${args[@]}"
          cp build/app/outputs/flutter-apk/app-release.apk "finding-the-lost-$GITHUB_RUN_NUMBER.apk"

      # If you've added your private key as repository secrets (see README,
      # "Private signing key"), the APK is re-signed with it. Without the
      # secrets, it stays signed with the public test key, which is fine for
      # testing but not for the Play Store.
      - name: Sign with your private key (if set up)
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          APK="finding-the-lost-$GITHUB_RUN_NUMBER.apk"
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "::warning::No private signing key set up, so this APK is signed with the public test key. Fine for testing; see README to add your own key."
            {
              echo "## Signing"
              echo "Signed with the **public test key** (no private key in repository secrets)."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          for name in RELEASE_KEYSTORE_PASSWORD RELEASE_KEY_ALIAS; do
            if [ -z "${!name}" ]; then
              echo "::error::The secret $name is missing. Add it under Settings > Secrets and variables > Actions."
              exit 1
            fi
          done
          KEYSTORE="$RUNNER_TEMP/release.keystore"
          echo "$RELEASE_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > "$KEYSTORE"
          # For PKCS12 keystores the key password is the keystore password.
          export KEY_PASS="${RELEASE_KEY_PASSWORD:-$RELEASE_KEYSTORE_PASSWORD}"
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)
          "${BUILD_TOOLS}apksigner" sign \
            --ks "$KEYSTORE" --ks-pass env:RELEASE_KEYSTORE_PASSWORD \
            --ks-key-alias "$RELEASE_KEY_ALIAS" --key-pass env:KEY_PASS \
            "$APK"
          rm -f "$KEYSTORE"
          "${BUILD_TOOLS}apksigner" verify --print-certs "$APK" | tee certs.txt
          {
            echo "## Signing"
            echo "Signed with your **private key**:"
            echo '```'
            grep -E "certificate DN|SHA-256" certs.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK (Actions artifact)
        uses: actions/upload-artifact@v4
        with:
          name: finding-the-lost-apk
          path: app/finding-the-lost-${{ github.run_number }}.apk

      - name: Publish APK (GitHub release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-build-${{ github.run_number }}
          name: "App build #${{ github.run_number }}"
          prerelease: true
          body: |
            Android test build of Finding the Lost from commit ${{ github.sha }}.
            Open this page on your phone and tap the .apk to install
            (allow "Install unknown apps" for your browser when asked).
          files: app/finding-the-lost-${{ github.run_number }}.apk
